name: Build Staff Companion
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-1-21-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build and test
        run: gradle :mc12111:build
      - uses: actions/upload-artifact@v4
        with:
          name: GovernixStaffMod-1.21.11
          path: mc12111/build/libs/*.jar
